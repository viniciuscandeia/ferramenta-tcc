# estado-projeto.yaml — Template comentado (Z20, Z21)
#
# Este arquivo é criado pelo orquestrador no início de cada projeto.
# É a Fonte de Verdade (SoT) do estado corrente (D13).
# Em caso de ausência ou ilegibilidade: ativar detection-based recovery (D10).
#
# INSTRUÇÃO DE USO: Copiar para a raiz do projeto do usuário com nome `estado-projeto.yaml`.
# Remover os comentários (#) do arquivo em produção.

# ──────────────────────────────────────────────
# ESTADO CORRENTE
# ──────────────────────────────────────────────

projeto_dir: /caminho/absoluto/do/projeto   # capturado via `pwd` no boot (passo 0); usado como prefixo em todas as operações de arquivo
marco_corrente: M1          # M1 | M2 | M3 | M4 | concluido
modo: padrao                # padrao | express  (Z15 — express reduz loops e rigor de checker)

gate_status:
  gate_1: pendente           # pendente | aprovado | bloqueado
  gate_2: pendente           # bloqueado se pautas-reelicitacao.md tiver itens [ ]
  gate_3: pendente           # bloqueado se analyze-report.md tiver issues BLOQUEADOR (🔴)
  gate_4: nao_solicitado     # nao_solicitado | pendente | aprovado

# ──────────────────────────────────────────────
# CONTROLE DE LOOPS
# ──────────────────────────────────────────────

loop_m2_iteracoes: 0         # incrementado a cada retorno ao collector (máx: 3 — constitution §POLÍTICA DE GATES)
loop_m3_iteracoes: 0         # incrementado a cada retorno ao documenter (máx: 3)

# ──────────────────────────────────────────────
# AGENDA M2 — pacing state-driven (C3)
# ──────────────────────────────────────────────
# Criado pelo orquestrador ao avançar para M2 (após Gate 1 aprovado).
# Define qual ronda o collector deve executar AGORA — apenas uma por turno.
# Modeler avança topico_atual após cada execução.
# Se marco_corrente=M2 mas agenda_m2 ausente: criar com defaults abaixo.

agenda_m2:
  topico_atual: "entrevista"     # ronda corrente — uma das 5
  topicos_pendentes:             # ordem fixa da Fase A
    - "entrevista"                # Ronda 1 → entrevista-estruturada
    - "cenarios"                  # Ronda 2 → cenario-narrativa
    - "dominio"                   # Ronda 3 → recomendacao-dominio
    - "implicitos"                # Ronda 4 → recomendacao-implicitos
    - "feixe"                     # Ronda 5 → questionario-feixe (condicional)
  topicos_concluidos: []
  rodada_corrente: 1              # incrementado quando todos topicos retornam à fase B

# ──────────────────────────────────────────────
# ARTEFATOS — com audit trail (Z21)
# ──────────────────────────────────────────────

artefatos:
  # Formato por artefato: nome | marco | iteracao | modo | gate | aprovado_em
  - nome: documentos-para-leigo/01-visao/01-visao-produto.md
    marco: M1
    iteracao: 1
    modo: leigo              # leigo | normativo | tecnico
    gate: gate_1
    aprovado_em: null        # "2026-06-01T10:30:00" quando aprovado

  - nome: documentos-tecnicos/01-visao/01-visao-produto.md
    marco: M1
    iteracao: 1
    modo: normativo
    gate: gate_1
    aprovado_em: null

  # Marco 2 — acrescentar quando gerados:
  # - nome: 02-requisitos/03.1-funcionais.md
  # - nome: 02-requisitos/03.1-funcionais-leigo.md
  # - nome: 02-requisitos/03.2-qualidade.md
  # - nome: 02-requisitos/03.2-qualidade-leigo.md
  # - nome: 02-requisitos/03.3-restricoes.md
  # - nome: 02-requisitos/03.3-restricoes-leigo.md
  # - nome: 02-requisitos/glossario.md
  # - nome: 02-requisitos/pautas-reelicitacao.md  (condicional)
  # - nome: 02-requisitos/conflitos-detectados.md (condicional — apenas se ≥ 1 conflito)
  # - nome: 02-requisitos/03.4-premissas.md       (condicional — apenas se premissas detectadas)

  # Marco 3 — acrescentar quando gerados:
  # - nome: 03-documento/SRS-completo.md
  # - nome: 03-documento/SRS-completo-leigo.md
  # - nome: 03-documento/analyze-report.md
  # - nome: 03-documento/rastreabilidade.md      (condicional)
  # 03-documento/spec/*.feature e 03-documento/tests/ são técnicos — não gerar versão leigo (D18, D19)

pautas_abertas: []           # lista de IDs de pautas abertas em pautas-reelicitacao.md

versao_leigo_aprovada: []    # lista de artefatos com versão leigo aprovada pelo usuário

ultima_atualizacao: "2026-05-18T00:00:00"

# ──────────────────────────────────────────────
# PASS LOG — APPEND-ONLY (Z20)
# ──────────────────────────────────────────────
#
# REGRA: Nunca sobrescrever uma entrada existente.
# Cada execução do checker ACRESCENTA uma nova entrada abaixo.
# O histórico de diagnósticos É o artefato de auditoria.

passes: []
# Formato de cada entrada quando executada pelo checker:
# - iteracao: 1
#   marco: M3
#   agente: checker
#   data: "2026-06-01T11:00:00"
#   resumo_quantitativo: "🔴 0 | 🟠 2 | 🟡 1 | 🔵 0"
#   artefato: analyze-report.md
#   resolvidos_vs_anterior: []   # IDs resolvidos em relação à iteração anterior
#   persistem: []                # IDs que persistem da iteração anterior
#   novos: []                    # IDs novos nesta iteração

