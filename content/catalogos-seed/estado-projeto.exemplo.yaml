# estado-projeto.yaml — Template comentado (Z20, Z21)
#
# Este arquivo é criado pelo orquestrador no início de cada projeto.
# É a Fonte de Verdade (SoT) do estado corrente (D13).
# Em caso de ausência ou ilegibilidade: ativar detection-based recovery (D10).
#
# INSTRUÇÃO DE USO: Copiar para a raiz do projeto do usuário com nome `estado-projeto.yaml`.
# Remover os comentários (#) do arquivo em produção.

# ──────────────────────────────────────────────
# ESTADO CORRENTE
# ──────────────────────────────────────────────

projeto_dir: /caminho/absoluto/do/projeto   # capturado via `pwd` no boot (passo 0); usado como prefixo em todas as operações de arquivo
nome_projeto: "Ainda não definido"          # atualizado em M1 quando usuário define o nome; lido pelo md_to_pdf.sh
marco_corrente: M1          # M1 | M2 | M3 | M4 | concluido
modo: padrao                # padrao | express  (Z15 — express reduz loops e rigor de checker)
sessao_pausada: false       # true só quando o usuário pede pausa; stop_guard.sh só permite encerrar se true ou marco_corrente=concluido

gate_status:
  gate_1: pendente           # pendente | aprovado | bloqueado
  gate_2: pendente           # bloqueado se pautas-reelicitacao.md tiver itens [ ]
  gate_3: pendente           # bloqueado se analyze-report.md tiver issues CRITICAL (🔴 BLOQUEADOR)
  gate_4: nao_solicitado     # nao_solicitado | pendente | aprovado

# ──────────────────────────────────────────────
# CONTROLE DE LOOPS
# ──────────────────────────────────────────────

loop_m2_iteracoes: 0         # incrementado a cada retorno ao collector (sem teto fixo — ver content/constitution.md §POLÍTICA DE GATES)
loop_m3_iteracoes: 0         # incrementado a cada retorno ao documenter (sem teto fixo — loop para somente por convergência; usuário pode pausar, nunca pular o gate)

# ──────────────────────────────────────────────
# CAMPOS ESCRITOS AO LONGO DO FLUXO (presentes só após o evento)
# ──────────────────────────────────────────────
# gate_1_aprovado_em: "2026-06-01T10:30:00"   # escrito na aprovação do Gate 1 (idem gate_2/3/4_aprovado_em)
# gate_1_motivo_bloqueio: "motivo"            # escrito quando o gate é bloqueado (idem gate_2/3/4_motivo_bloqueio)
# lacunas_m1:                                 # escrito por contexto-e-limite (D16)
#   categorias: [escopo_funcional]
#   contagem: 1
# modelagem_visual_gerada: true               # M3 — após modelagem-visual
# fase_a_concluida: true                      # M3 — após Fase A completa

# ──────────────────────────────────────────────
# AGENDA M2 — pacing state-driven (C3)
# ──────────────────────────────────────────────
# Criado pelo orquestrador ao avançar para M2 (após Gate 1 aprovado).
# Define qual ronda o collector deve executar AGORA — apenas uma por turno.
# Modeler avança topico_atual após cada execução.
# Se marco_corrente=M2 mas agenda_m2 ausente: criar com defaults abaixo.

agenda_m2:
  topico_atual: "entrevista"     # ronda corrente — uma das 5
  topicos_pendentes:             # ordem fixa da Fase A
    - "entrevista"                # Ronda 1 → entrevista-estruturada
    - "cenarios"                  # Ronda 2 → cenario-narrativa
    - "dominio"                   # Ronda 3 → recomendacao-dominio
    - "implicitos"                # Ronda 4 → recomendacao-implicitos
    - "feixe"                     # Ronda 5 → questionario-feixe (condicional)
  topicos_concluidos: []
  rodada_corrente: 1              # incrementado quando todos topicos retornam à fase B

# ──────────────────────────────────────────────
# ARTEFATOS — com audit trail (Z21)
# ──────────────────────────────────────────────

artefatos:
  # Formato por artefato: nome | marco | iteracao | modo | gate | aprovado_em
  - nome: documentos-para-leigo/01-visao/01-visao-produto.md
    marco: M1
    iteracao: 1
    modo: leigo              # leigo | normativo | tecnico
    gate: gate_1
    aprovado_em: null        # "2026-06-01T10:30:00" quando aprovado

  - nome: documentos-tecnicos/01-visao/01-visao-produto.md
    marco: M1
    iteracao: 1
    modo: normativo
    gate: gate_1
    aprovado_em: null

  # Marco 2 — acrescentar quando gerados:
  # - nome: documentos-tecnicos/02-requisitos/02.1-requisitos-funcionais.md
  # - nome: documentos-para-leigo/02-requisitos/02.1-requisitos-funcionais.md
  # - nome: documentos-tecnicos/02-requisitos/02.2-requisitos-qualidade.md
  # - nome: documentos-para-leigo/02-requisitos/02.2-requisitos-qualidade.md
  # - nome: documentos-tecnicos/02-requisitos/02.3-restricoes.md
  # - nome: documentos-para-leigo/02-requisitos/02.3-restricoes.md
  # - nome: documentos-tecnicos/02-requisitos/02.5-glossario.md
  # - nome: documentos-tecnicos/02-requisitos/02.6-pautas-reelicitacao.md
  # - nome: documentos-tecnicos/02-requisitos/02.4-premissas.md        (condicional — apenas se premissas detectadas)
  # - nome: documentos-tecnicos/02-requisitos/02.7-conflitos-detectados.md (condicional — apenas se ≥ 1 conflito)

  # Marco 3 — acrescentar quando gerados:
  # - nome: documentos-tecnicos/03-documento/03-srs-completo.md
  # - nome: documentos-para-leigo/03-documento/03-documento-do-projeto.md
  # - nome: documentos-tecnicos/03-documento/03.1-analyze-report.md
  # - nome: documentos-tecnicos/03-documento/03.2-rastreabilidade.md  (condicional)
  # - nome: documentos-tecnicos/03-documento/03.3-diagramas.md        (condicional)
  # 03.1-analyze-report.md, 03.2-rastreabilidade.md e 03.3-diagramas.md são internos/técnicos — não gerar versão leigo separada (exceção D18/D19)

pautas_abertas: []           # lista de IDs de pautas abertas em pautas-reelicitacao.md — manter formato inline [...] (load_state.sh lê apenas a forma inline)

versao_leigo_aprovada: []    # lista de artefatos com versão leigo aprovada pelo usuário — manter formato inline [...]

ultima_atualizacao: "2026-05-18T00:00:00"

# ──────────────────────────────────────────────
# PASS LOG — APPEND-ONLY (Z20)
# ──────────────────────────────────────────────
#
# REGRA: Nunca sobrescrever uma entrada existente.
# Cada execução do checker ACRESCENTA uma nova entrada abaixo.
# O histórico de diagnósticos É o artefato de auditoria.

passes: []
# Formato de cada entrada quando executada pelo checker:
# - iteracao: 1
#   marco: M3
#   agente: checker
#   data: "2026-06-01T11:00:00"
#   resumo_quantitativo: "🔴 0 | 🟠 2 | 🟡 1 | 🔵 0"
#   artefato: analyze-report.md
#   resolvidos_vs_anterior: []   # IDs resolvidos em relação à iteração anterior
#   persistem: []                # IDs que persistem da iteração anterior
#   novos: []                    # IDs novos nesta iteração

